id: rule-015
name: Metasploit Reverse TCP Shell Handler
description: Flags outbound connections targeting standard Metasploit reverse shell ports (4444, 4445, 5555).
severity: critical
category: command_and_control
enabled: true

condition:
  type: port_match
  ports:
    - 4444
    - 4445
    - 5555

action:
  alert: true
  block_ip: true

mitre_attack: T1059
tags:
  - metasploit
  - reverse_shell
