id: rule-011
name: Telnet Cleartext Auth Brute Force
description: Detects connection spikes targeting legacy Telnet port 23.
severity: high
category: credential_access
enabled: true

condition:
  type: single_target_rate
  target_port: 23
  threshold_count: 5
  window_seconds: 5
  group_by: src_ip

action:
  alert: true
  block_ip: false

mitre_attack: T1110
tags:
  - telnet
  - brute_force
