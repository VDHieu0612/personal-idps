id: rule-010
name: FTP Service Brute Force
description: Detects rapid repeated connection attempts targeting FTP Port 21.
severity: high
category: credential_access
enabled: true

condition:
  type: single_target_rate
  target_port: 21
  threshold_count: 5
  window_seconds: 5
  group_by: src_ip

action:
  alert: true
  block_ip: false

mitre_attack: T1110
tags:
  - ftp
  - brute_force
