id: rule-012
name: MySQL Database Auth Probe
description: Flags rapid connection attempts targeting MySQL Port 3306.
severity: high
category: credential_access
enabled: true

condition:
  type: single_target_rate
  target_port: 3306
  threshold_count: 5
  window_seconds: 5
  group_by: src_ip

action:
  alert: true
  block_ip: false

mitre_attack: T1110
tags:
  - mysql
  - database
